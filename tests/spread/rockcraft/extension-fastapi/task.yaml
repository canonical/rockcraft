summary: fastapi extension test
environment:
  BASE/bare_2404: bare
  BASE/bare_2604: bare
  BASE/base_2404: ubuntu@24.04
  BASE/base_2604: ubuntu@26.04

  BUILD_BASE/bare_2404: ubuntu@24.04
  BUILD_BASE/bare_2604: ubuntu@26.04
  BUILD_BASE/base_2404: ubuntu@24.04
  BUILD_BASE/base_2604: ubuntu@26.04

  ROCKCRAFT_ENABLE_EXPERIMENTAL_EXTENSIONS: "true"

execute: |
  BASE_TYPE="base"
  if [ "${BASE}" = "bare" ]; then
    BASE_TYPE="bare"
  fi
  NAME="fastapi-${BASE_TYPE}-${BUILD_BASE#ubuntu@}"
  NAME="${NAME//./-}"
  ROCK_FILE="${NAME}_0.1_amd64.rock"
  IMAGE="${NAME}:0.1"

  run_rockcraft init --name fastapi-extension --profile fastapi-framework
  sed -i "s/^name: .*/name: ${NAME}/g" rockcraft.yaml
  sed -i "s/^base: .*/base: ${BASE}/g" rockcraft.yaml
  sed -i "s/^build-base: .*/build-base: ${BUILD_BASE}/g" rockcraft.yaml
  if [ "${BASE}" = "bare" ]; then
    cat >> rockcraft.yaml <<EOL
  parts:
    find-app:
      plugin: nil
      stage-packages:
        - findutils
  EOL
  fi
  run_rockcraft pack

  test -f "${ROCK_FILE}"

  # Ensure docker does not have this container image
  docker rmi --force "${IMAGE}"

  # Install image
  sudo rockcraft.skopeo --insecure-policy copy "oci-archive:${ROCK_FILE}" "docker-daemon:${IMAGE}"

  # Ensure image exists
  docker images "${IMAGE}" | MATCH "${NAME}"

  # ensure container doesn't exist
  docker rm -f "${NAME}-container"

  # ensure the app and promtail folders have the correct user
  check_directory_ownership() {
    local directory="$1"
    docker run --rm --entrypoint /usr/bin/bash "${IMAGE}" -c "find ${directory}/ ! -user '_daemon_' || { echo 'Error: ${directory} or its contents are not owned by _daemon_'; exit 2; }"
  }

  check_directory_ownership "/app"
  check_directory_ownership "/opt/promtail"
  check_directory_ownership "/etc/promtail"
  if [ "${BUILD_BASE}" = "ubuntu@26.04" ]; then
    docker run --rm --entrypoint /usr/bin/bash "${IMAGE}" -c \
      "test -z \"\$(find /app-data/ ! -user '_daemon_')\" && test -w /app-data"
  fi

  # test the default fastapi service
  docker run --name "${NAME}-container" -d -p 8137:8000 "${IMAGE}"
  retry -n 5 --wait 2 curl localhost:8137
  [ "$(curl -sSf localhost:8137)" == "ok" ]
  if [ "${BUILD_BASE}" = "ubuntu@26.04" ]; then
    [ "$(curl -sSf -X POST localhost:8137/write-app-data)" == "written" ]
    docker exec "${NAME}-container" /usr/bin/bash -c \
      "test \"\$(cat /app-data/fastapi-write-test.txt)\" = 'written by FastAPI' && \
      test \"\$(stat -c '%U:%G' /app-data/fastapi-write-test.txt)\" = '_daemon_:_daemon_'"
  fi

restore: |
  BASE_TYPE="base"
  if [ "${BASE}" = "bare" ]; then
    BASE_TYPE="bare"
  fi
  NAME="fastapi-${BASE_TYPE}-${BUILD_BASE#ubuntu@}"
  NAME="${NAME//./-}"
  ROCK_FILE="${NAME}_0.1_amd64.rock"
  docker stop "${NAME}-container" || true
  docker rm --force "${NAME}-container"
  rm -f "${ROCK_FILE}" rockcraft.yaml
  docker system prune -a -f
