summary: spring-boot extension test
environment:
  PROJECT_BASE/gradle_bare: gradle
  PROJECT_BASE/gradle_bare_2604: gradle
  PROJECT_BASE/gradle_2404: gradle
  PROJECT_BASE/gradle_2604: gradle
  PROJECT_BASE/maven_bare: maven
  PROJECT_BASE/maven_bare_2604: maven
  PROJECT_BASE/maven_2404: maven
  PROJECT_BASE/maven_2604: maven

  BASE/gradle_bare: bare
  BASE/gradle_bare_2604: bare
  BASE/gradle_2404: ubuntu@24.04
  BASE/gradle_2604: ubuntu@26.04
  BASE/maven_bare: bare
  BASE/maven_bare_2604: bare
  BASE/maven_2404: ubuntu@24.04
  BASE/maven_2604: ubuntu@26.04

  BUILD_BASE/gradle_bare: ubuntu@24.04
  BUILD_BASE/gradle_bare_2604: ubuntu@26.04
  BUILD_BASE/gradle_2404: ubuntu@24.04
  BUILD_BASE/gradle_2604: ubuntu@26.04
  BUILD_BASE/maven_bare: ubuntu@24.04
  BUILD_BASE/maven_bare_2604: ubuntu@26.04
  BUILD_BASE/maven_2404: ubuntu@24.04
  BUILD_BASE/maven_2604: ubuntu@26.04

  ROCKCRAFT_ENABLE_EXPERIMENTAL_EXTENSIONS: "true"

execute: |
  NAME="spring-boot-${BASE//@/-}-${PROJECT_BASE}"
  NAME="${NAME//./-}"
  ROCK_FILE="${NAME}_0.1_amd64.rock"
  IMAGE="${NAME}:0.1"
  JAVA_VERSION=21
  if [ "${BUILD_BASE}" = "ubuntu@26.04" ]; then
    JAVA_VERSION=25
  fi
  BOOT_VERSION=$(curl -s https://start.spring.io/metadata/client \
    | grep -o '"bootVersion":{[^}]*}' \
    | grep -o '"default":"[^"]*"' \
    | cut -d '"' -f 4)
  BOOT_VERSION="${BOOT_VERSION%.RELEASE}"
  test -n "${BOOT_VERSION}"
  sudo snap install devpack-for-spring --edge --classic
  rm -rf "${NAME}-app"
  devpack-for-spring boot start \
    --path "${NAME}-app" \
    --project "${PROJECT_BASE}-project" \
    --language java \
    --boot-version "${BOOT_VERSION}" \
    --version 0.0.1 \
    --group com.example \
    --artifact demo \
    --name demo \
    --description "Demo project for Spring Boot" \
    --package-name com.example.demo \
    --dependencies web \
    --packaging jar \
    --java-version "${JAVA_VERSION}"
  cd "${NAME}-app" || exit 1
  run_rockcraft init --name "${NAME}" --profile spring-boot-framework

  # Replace base & build-base with ubuntu@<base>
  sed -i "s/^base: .*/base: ${BASE}/g" rockcraft.yaml
  sed -i "s/^build-base: .*/build-base: ${BUILD_BASE}/g" rockcraft.yaml

  run_rockcraft pack
  test -f "${ROCK_FILE}"
  test ! -d work
  # Ensure docker does not have this container image
  docker rmi --force "${IMAGE}"
  # Install container
  sudo rockcraft.skopeo --insecure-policy copy "oci-archive:${ROCK_FILE}" \
  "docker-daemon:${IMAGE}"
  # Ensure container exists
  docker images "${IMAGE}" | MATCH "${NAME}"
  # Ensure container doesn't exist
  docker rm -f "${NAME}-container"
  # test the default spring-boot service
  docker run --name "${NAME}-container" -d -p 8080:8080 "${IMAGE}"
  retry -n 5 --wait 3 curl localhost:8080
  http_status=$(curl -s -o /dev/null -w "%{http_code}" localhost:8080)
  [ "${http_status}" -eq 404 ]

restore: |
  NAME="spring-boot-${BASE//@/-}-${PROJECT_BASE}"
  NAME="${NAME//./-}"
  docker rm -f "${NAME}-container" || true
  rm -rf "${NAME}-app"
  rm -f -- *.rock rockcraft.yaml
  docker system prune -a -f
