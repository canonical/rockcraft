name: overlay-certificates
summary: Test certificates generated by overlay packages with Ubuntu Pro
description: |
  Reproduce missing CA certificates and a Java truststore when Ubuntu Pro is enabled.
version: "0.1"
license: Apache-2.0
base: ubuntu@22.04

platforms:
  amd64:

parts:
  runtime:
    plugin: nil
    overlay-packages:
      - ca-certificates
      - openjdk-17-jre-headless
