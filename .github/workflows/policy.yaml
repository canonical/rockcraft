name: Check policy
on:
  pull_request:
  push:
    branches:
      - main
      - hotfix/*
      - work/check-policy # For development

jobs:
  conventional-commits:
    name: Check PR title for Conventional Commits
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: PR Conventional Commit Validation
        uses: ytanikin/pr-conventional-commits@639145d78959c53c43112365837e3abd21ed67c1 # 1.5.2
        with:
          task_types: >-
            ["build", "chore", "ci", "docs", "feat", "fix", "perf", "refactor",
            "revert", "style", "test"]
          add_label: "false"
  zizmor:
    name: GitHub Actions security audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@5f14fd08f7cf1cb1609c1e344975f152c7ee938d # v0.5.6
        with:
          advanced-security: ${{ !github.event.repository.private }}
          online-audits: ${{ !github.event.repository.private }}
          annotations: ${{ github.event.repository.private }}
  python-scans:
    name: Security scan
    uses: canonical/starflow/.github/workflows/scan-python.yaml@main
    with:
      osv-extra-args: "--config=osv-scanner.toml"
      uv-export-no-groups: |
        docs
        docs-sphinx-stack
      osv-exclude-paths: |
        docs/
        tests/spread/
        tests/data/
