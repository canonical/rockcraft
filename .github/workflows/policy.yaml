name: Check policy
on:
  pull_request:
  push:
    branches:
      - main
      - hotfix/*
      - work/check-policy # For development

jobs:
  policy:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: canonical/starflow/.github/workflows/policy.yaml@work/testing-skill
  python-scans:
    name: Security scan
    uses: canonical/starflow/.github/workflows/scan-python.yaml@work/testing-skill
    with:
      osv-extra-args: "--config=osv-scanner.toml"
      uv-export-no-groups: |
        docs
        docs-sphinx-stack
      osv-exclude-paths: |
        docs/
        tests/spread/
        tests/data/
